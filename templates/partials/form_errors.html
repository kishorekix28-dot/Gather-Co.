{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{% for e in form.non_field_errors %}<div>{{ e }}</div>{% endfor %}</div>{% endif %}
{% if form.errors and not form.non_field_errors %}<div class="alert alert-danger py-2" role="alert"><i class="bi bi-exclamation-circle me-1"></i>Please correct the highlighted fields.</div>{% endif %}
