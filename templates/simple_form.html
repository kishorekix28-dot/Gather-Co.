{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-8">
  <div class="page-header"><div><h1>{{ title }}</h1></div></div>
  <form method="post" novalidate data-loading class="card">{% csrf_token %}
    <div class="card-body">
      {% include "partials/form_errors.html" %}
      <div class="row g-3">{% for field in form %}{% include "partials/field.html" with field=field %}{% endfor %}</div>
    </div>
    <div class="card-body border-top d-flex justify-content-end gap-2">
      <a class="btn btn-light" href="{% url cancel_url %}">Cancel</a>
      <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save</button>
    </div>
  </form>
</div></div>
{% endblock %}
