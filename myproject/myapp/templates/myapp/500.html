{% extends "myapp/base.html" %}

{% block title %}Server error · Gather{% endblock %}

{% block content %}
<section class="support-hero error-page">
    <p class="eyebrow">Error 500</p>
    <h1>We hit an unexpected snag.</h1>
    <p class="muted">Please try again in a moment. If the problem continues, let the assistant know.</p>
    <div class="hero-actions">
        <a class="button" href="{% url 'home' %}">Back to home</a>
        <button class="button secondary open-assistant" type="button">Ask the assistant</button>
    </div>
</section>
{% endblock %}
